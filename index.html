<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>$CYFROG — The Meme That Evolves</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  min-height:100vh;
}
main{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
}
.logo{
  width:140px;
  height:140px;
  margin:auto;
  border:2px solid #00ff88;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:48px;
  box-shadow:0 0 30px #00ff88;
}
h1{
  color:#00ff88;
  font-size:clamp(42px,9vw,90px);
  margin:30px 0 10px;
  letter-spacing:4px;
}
p{
  color:#aaa;
  font-size:20px;
  margin:0 0 30px;
}
.btn{
  display:inline-block;
  padding:14px 28px;
  border:1px solid #00ff88;
  color:#00ff88;
  text-decoration:none;
  border-radius:8px;
  transition:.2s;
}
.btn:hover{
  background:#00ff88;
  color:#000;
}
footer{
  position:fixed;
  bottom:20px;
  width:100%;
  text-align:center;
  color:#555;
  font-size:13px;
}
</style>
</head>
<body>

<main>
  <div>
    <div class="logo">🐸</div>
    <h1>$CYFROG</h1>
    <p>The Meme That Evolves.</p>
    <a class="btn" href="#">ENTER THE EVOLUTION</a>
  </div>
</main>

<footer>
  The Meme That Evolves. Join the cyber evolution.
</footer>

</body>
</html>
